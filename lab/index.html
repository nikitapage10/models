<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C.E.O. Motion Lab</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
<style>
/* Layout: an editor. Controls on the left, the stage in the middle, the timeline along the bottom. */
:root {
  --void: #0b0d12; --panel: #12151c; --raise: #1a1e27; --line: #2a303c;
  --ink: #e9e6df; --dim: #9097a3; --brass: #c9a25c; --pick: #8fd3ff; --warn: #ffb36b;
  --display: "Cormorant Garamond", Georgia, serif; --body: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--void); color: var(--ink); font: 13px/1.45 var(--body); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--pick); outline-offset: 2px; }
.app { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) 190px; grid-template-columns: 340px minmax(0, 1fr); }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--panel); }
.mark { font: 600 20px/1 var(--display); letter-spacing: .14em; }
.mark small { font: 500 11px var(--mono); letter-spacing: .18em; color: var(--dim); margin-left: 8px; text-transform: uppercase; }
nav { display: flex; gap: 4px; }
.tab { background: none; border: 1px solid transparent; border-radius: 999px; padding: 5px 13px; cursor: pointer; font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dim); }
.tab[aria-selected="true"] { color: var(--ink); border-color: var(--line); background: var(--raise); }
header a { margin-left: auto; color: var(--dim); font: 12px var(--mono); }
aside { grid-row: 2 / 4; overflow-y: auto; border-right: 1px solid var(--line); background: var(--panel); padding: 12px 14px 40px; display: grid; gap: 14px; align-content: start; }
.stage { position: relative; min-width: 0; min-height: 0; }
.stage canvas { display: block; width: 100%; height: 100%; }
.hud { position: absolute; left: 12px; top: 10px; font: 12px var(--mono); color: var(--dim); pointer-events: none; }
.transport { position: absolute; right: 12px; top: 10px; display: flex; gap: 6px; }
.timeline { grid-column: 2; border-top: 1px solid var(--line); background: var(--panel); position: relative; min-width: 0; }
.timeline canvas { width: 100%; height: 100%; display: block; }
section { display: grid; gap: 8px; }
h2 { margin: 0; font: 600 18px var(--display); letter-spacing: .03em; }
h3 { margin: 4px 0 0; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--raise); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.btn:hover { border-color: var(--dim); }
.btn[aria-pressed="true"] { background: var(--pick); color: var(--void); border-color: var(--pick); }
.btn.primary { border-color: var(--brass); color: var(--brass); background: none; }
.btn.small { padding: 2px 7px; font-size: 12px; }
.slider { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 2px 8px; align-items: center; }
.slider label { font-size: 12px; color: #cfcbc2; overflow-wrap: anywhere; }
.slider input[type=range] { grid-column: 1; width: 100%; accent-color: var(--pick); }
.slider input[type=number] { grid-row: 1 / 3; grid-column: 2; width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; font: 12px var(--mono); }
.group { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; display: grid; gap: 8px; }
.group > summary { cursor: pointer; font: 500 12px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--dim); }
.toggle { display: flex; align-items: flex-start; gap: 8px; cursor: pointer; }
.toggle small { display: block; color: var(--dim); }
select, textarea, input[type=text], input[type=search] { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; width: 100%; }
textarea { min-height: 90px; resize: vertical; }
.note { font-size: 12px; color: var(--dim); margin: 0; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; position: absolute; left: 10px; top: 6px; font: 11px var(--mono); pointer-events: none; }
.legend i { display: inline-block; width: 10px; height: 3px; margin-right: 5px; vertical-align: middle; }
.list { display: grid; gap: 6px; }
.layer { border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 6px; }
.layer header, .layer .head { display: flex; align-items: center; gap: 8px; padding: 0; border: 0; background: none; }
.toast { position: fixed; bottom: 16px; left: 50%; translate: -50% 0; background: var(--ink); color: var(--void); padding: 8px 14px; border-radius: 8px; z-index: 10; }
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 52vh 150px auto; height: auto; }
  aside { grid-row: 4; border-right: 0; overflow: visible; }
  .stage { height: 52vh; }
  .timeline { grid-column: 1; height: 150px; }
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">C.E.O.<small>Motion lab</small></div>
    <nav role="tablist">
      <button class="tab" role="tab" id="tab-motion" aria-selected="true">Motion</button>
      <button class="tab" role="tab" id="tab-animator" aria-selected="false">Animator</button>
    </nav>
    <a href="../">← Model library</a>
  </header>
  <aside id="panel"></aside>
  <div class="stage" id="stage">
    <div class="hud" id="hud"></div>
    <div class="transport" id="transport"></div>
  </div>
  <div class="timeline" id="timeline"><canvas id="timeline-canvas"></canvas><div class="legend" id="legend"></div></div>
</div>
<script type="module" src="./app.js"></script>
</body>
</html>
